---
# Unter WSL kann die Font nicht in Linux "installiert" werden - die Darstellung macht
# die Windows-Seite. Wir installieren sie deshalb Windows-seitig:
#   - SYSTEMWEIT (C:\Windows\Fonts + HKLM), einmalige UAC-Abfrage pro Maschine
#   - aktiviert NUR im WSL-Terminalprofil (font.face nur dort, PowerShell/cmd unberuehrt)
#   - zusaetzlich im integrierten Terminal von VS Code
# Vollautomatisch bis auf die UAC-Bestaetigung.
#
# Warum nicht mehr pro Benutzer (%LOCALAPPDATA%, HKCU, ohne UAC): eine so registrierte
# Font sieht nur GDI - also conhost bzw. die Ubuntu-Verknuepfung. Windows Terminal
# (Paket-App, DirectWrite) und VS Code (Chromium/DirectWrite) loesen den Familiennamen
# dann nicht auf und fallen still auf die Standardfont zurueck, in der die
# Nerd-Font-Icons fehlen: derselbe Prompt sieht je nach Startweg anders aus.

- name: WSL erkennen
  ansible.builtin.command: grep -qi microsoft /proc/version
  register: is_wsl
  failed_when: false
  changed_when: false

- name: Font-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/nerd-fonts"
    state: directory
    mode: "0755"

- name: Nerd Font herunterladen
  ansible.builtin.unarchive:
    src: "{{ nerd_font_url }}"
    dest: "{{ ansible_user_dir }}/nerd-fonts"
    remote_src: true
    creates: "{{ ansible_user_dir }}/nerd-fonts/LICENSE"

- name: Fonts registrieren (natives Linux)
  ansible.builtin.command: fc-cache -f
  when: is_wsl.rc != 0
  changed_when: true

- name: WSL-seitige Windows-Integration
  when: is_wsl.rc == 0
  block:
    - name: Windows-Benutzername ermitteln
      ansible.builtin.shell: |
        set -o pipefail
        ls /mnt/c/Users 2>/dev/null | grep -viE '^(public|default|all users|defaultuser0)$' | head -1
      args:
        executable: /bin/bash
      register: win_user
      changed_when: false
      failed_when: false

    - name: PowerShell-Installer rendern
      ansible.builtin.template:
        src: install-fonts.ps1.j2
        dest: "{{ ansible_user_dir }}/nerd-fonts/install-fonts.ps1"
        mode: "0644"
      when: win_user.stdout | trim | length > 0

    - name: UNC-Pfade fuer Windows ermitteln
      ansible.builtin.shell: |
        set -o pipefail
        echo "SCRIPT=$(wslpath -w "{{ ansible_user_dir }}/nerd-fonts/install-fonts.ps1")"
        echo "SOURCE=$(wslpath -w "{{ ansible_user_dir }}/nerd-fonts")"
      args:
        executable: /bin/bash
      register: unc_paths
      changed_when: false
      when: win_user.stdout | trim | length > 0

    - name: UNC-Pfade als Facts setzen
      ansible.builtin.set_fact:
        ps1_unc: "{{ unc_paths.stdout_lines[0].split('=', 1)[1] }}"
        fonts_unc: "{{ unc_paths.stdout_lines[1].split('=', 1)[1] }}"
      when: win_user.stdout | trim | length > 0

    - name: Font systemweit installieren (Registry + AddFontResourceW, mit UAC)
      # argv statt cmd-String: cmd als String parst das Modul mit shlex, das
      # Backslashes in UNC-Windows-Pfaden (\\wsl.localhost\...) verstuemmelt,
      # bevor PowerShell sie zu sehen bekommt. argv umgeht jedes Shell-Parsing.
      ansible.builtin.command:
        argv:
          - powershell.exe
          - -NoProfile
          - -ExecutionPolicy
          - Bypass
          - -File
          - "{{ ps1_unc }}"
          - -SourceDir
          - "{{ fonts_unc }}"
      register: font_install
      # Der Installer meldet einen Vorab-Treffer, statt erneut zu eskalieren - so bleibt
      # ein Wiederholungslauf ehrlich "ok" und nicht dauerhaft "changed".
      changed_when: "'Bereits systemweit installiert' not in font_install.stdout"
      when: win_user.stdout | trim | length > 0

    - name: Ergebnisdatei des Installers pruefen
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/nerd-fonts/family-name.txt"
      register: family_file
      when: win_user.stdout | trim | length > 0 and font_install is succeeded

    - name: Tatsaechlich vergebenen Font-Familiennamen einlesen
      # Nicht aus stdout parsen - powershell.exe liefert je nach Aufrufkontext eine
      # Windows-Codepage statt UTF-8 zurueck, was der WSL/Ansible-Interop schon
      # kaputte Bytes in der stdout-Erfassung beschert hat. Das PS1-Skript schreibt
      # den Namen deshalb in eine Datei, die hier als normale UTF-8-Datei gelesen wird.
      ansible.builtin.set_fact:
        nerd_font_family: "{{ lookup('file', ansible_user_dir + '/nerd-fonts/family-name.txt') | trim }}"
      when: family_file is defined and family_file.stat.exists

    - name: Font im integrierten Terminal von VS Code setzen
      ansible.builtin.command:
        cmd: >-
          python3 {{ role_path }}/files/update-vscode-font.py
          --user "{{ win_user.stdout | trim }}"
          --family "{{ nerd_font_family }}"
      register: vscode_update
      changed_when: "'geaendert:' in vscode_update.stdout"
      failed_when: false
      when:
        - setup_vscode_font | bool
        - win_user.stdout | trim | length > 0
        - nerd_font_family is defined

    - name: Font nur im WSL-Terminalprofil setzen (Windows Terminal settings.json)
      ansible.builtin.command:
        cmd: >-
          python3 {{ role_path }}/files/update-wt-font.py
          --user "{{ win_user.stdout | trim }}"
          --family "{{ nerd_font_family }}"
          --match "{{ wsl_terminal_profile_match }}"
      register: wt_update
      changed_when: "'geaendert:' in wt_update.stdout"
      failed_when: false
      when: win_user.stdout | trim | length > 0 and nerd_font_family is defined

    - name: Zusammenfassung
      ansible.builtin.debug:
        msg: >-
          {% if win_user.stdout | trim | length == 0 %}
          Windows-User nicht gefunden (/mnt/c/Users leer/unzugaenglich) - Font liegt
          unter {{ ansible_user_dir }}/nerd-fonts, manuell installieren.
          {% elif nerd_font_family is not defined %}
          PowerShell-Installation fehlgeschlagen: {{ font_install.stderr | default('unbekannter Fehler') }}
          {% elif wt_update.rc != 0 %}
          Font '{{ nerd_font_family }}' installiert, aber Windows Terminal settings.json
          nicht gefunden/aktualisiert: {{ wt_update.stderr | default(wt_update.stdout) }}.
          Manuell setzen: Einstellungen -> Ubuntu-Profil -> Erscheinungsbild -> Schriftart.
          {% else %}
          Fertig - Font '{{ nerd_font_family }}' ist systemweit installiert und im
          WSL-Terminalprofil{% if setup_vscode_font | bool %} sowie im VS-Code-Terminal{% endif %} aktiv.
          WICHTIG: Windows Terminal komplett beenden und neu starten - ein neuer Tab
          genuegt nicht. Die Font-Liste wird nur einmal beim Prozessstart gelesen, eine
          laufende Instanz kennt die frisch installierte Font nicht und faellt still auf
          die Standardfont ohne Icons zurueck.{% if setup_vscode_font | bool %}
          Fuer VS Code gilt dasselbe: Fenster neu laden reicht nicht, VS Code beenden
          und neu starten.{% endif %}
          {% endif %}
